<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusBite</title>
    <style>
.container{
    width:1200px;}
.banner img{
    width:1000px;}
body{
    font-size: 12px;
    color: #999;
    background-color: white;}
nav a{
    padding: 2px;
    margin-right: 4px;}
    </style>
</head>
<body>
    <header>
        <h1>CampusBite</h1>
        <p>Fresh Food, Better Mood!</p>
    </header>
    <nav>
        <a href="#menu">Menu</a>
        <a href="#special">Specials</a>
        <a href="#contact">Contact</a>
    </nav>
    <main class="container">
        <section class="banner" id="special">
            <h2>Today's Special</h2>
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800" width="800" height="500" alt="Special chicken burger">
            <p>Delicious Chicken Burger - ₹120</p>
        </section>
        <section class="menu" id="menu">
            <h2>Our Menu</h2>
            <div class="cards">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" width="400" height="300" alt="Burger">
                    <h3>Chicken Burger</h3>
                    <p>₹120</p>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" width="400" height="300" alt="Pizza">
                    <h3>Pizza</h3>
                    <p>₹180</p>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400" width="400" height="300" alt="Noodles">
                    <h3>Noodles</h3>
                    <p>₹100</p>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400" width="400" height="300" alt="Samosa">
                    <h3>Samosa</h3>
                    <p>₹30</p>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=400" width="400" height="300" alt="Grilled food">
                    <h3>Grilled Sandwich</h3>
                    <p>₹90</p>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400" width="400" height="300" alt="Chocolate cake">
                    <h3>Chocolate Cake</h3>
                    <p>₹70</p>
                </div>
            </div>
        </section>
    </main>
    <footer id="contact">
        <p>CampusBite | Contact: campusbite@example.com</p>
        <p>© 2026 CampusBite</p>
    </footer>
</body>
</html>
